services:
  mysql:
    image: mysql:8.4
    container_name: alldbackup-mysql
    environment:
      MYSQL_ROOT_PASSWORD: integration
    ports: ["3306:3306"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h127.0.0.1", "-pintegration"]
      interval: 3s
      timeout: 3s
      retries: 40

  mariadb:
    image: mariadb:11
    container_name: alldbackup-mariadb
    environment:
      MARIADB_ROOT_PASSWORD: integration
    ports: ["3307:3306"]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      timeout: 3s
      retries: 40

  postgres:
    image: postgres:16
    container_name: alldbackup-postgres
    environment:
      POSTGRES_USER: backup_user
      POSTGRES_PASSWORD: integration
      POSTGRES_DB: postgres
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U backup_user"]
      interval: 3s
      timeout: 3s
      retries: 40

  sqlite:
    build:
      context: .
      dockerfile: sqlite.Dockerfile
    container_name: alldbackup-sqlite
    command: ["sh", "-c", "sleep infinity"]
