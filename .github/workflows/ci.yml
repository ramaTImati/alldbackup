name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod tidy
      - run: go test ./...
      - run: go vet ./...
      - run: bash -n scripts/install.sh tests/installer.sh
      - run: |
          PS4='+${BASH_SOURCE}:${LINENO}: ' bash -x tests/installer.sh
      - run: GOOS=linux GOARCH=amd64 go build ./cmd/alldbackup
      - run: GOOS=linux GOARCH=arm64 go build ./cmd/alldbackup
