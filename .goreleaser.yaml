version: 2
project_name: alldbackup

builds:
  - id: alldbackup
    main: ./cmd/alldbackup
    binary: alldbackup
    goos: [linux]
    goarch: [amd64, arm64]
    env: [CGO_ENABLED=0]
    ldflags:
      - -s -w -X github.com/ramaTImati/alldbackup/internal/cli.Version={{.Version}}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

release:
  github:
    owner: ramaTImati
    name: alldbackup
